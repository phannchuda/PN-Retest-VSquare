start" class="c"><h1>PN Product Assessment 2569 — RETEST B</h1><p>30 ข้อ • 38 คะแนน • ผ่าน 80% • ไม่จำกัดเวลา</p><input id="firstName" placeholder="ชื่อ"><input id="lastName" placeholder="นามสกุล"><input id="nickname" placeholder="ชื่อเล่น"><label>สาขา</label><select id="branch" required><option value="">-- เลือกสาขา --</option><option value="ซีคอนศรีนครินทร์">ซีคอนศรีนครินทร์</option><option value="ดุสิต เซ็นทรัลพาร์ค">ดุสิต เซ็นทรัลพาร์ค</option><option value="ทองหล่อ">ทองหล่อ</option><option value="ปิ่นเกล้า">ปิ่นเกล้า</option><option value="พระราม 9">พระราม 9</option><option value="พาซิโอ้ กาญจนาภิเษก">พาซิโอ้ กาญจนาภิเษก</option><option value="ฟิวเจอร์พาร์ค รังสิต">ฟิวเจอร์พาร์ค รังสิต</option><option value="วันแบง ค็อก">วันแบง ค็อก</option><option value="สยามสแควร์วัน">สยามสแควร์วัน</option><option value="เกตเวย์ เอกมัย">เกตเวย์ เอกมัย</option><option value="เซ็นทรัล นครปฐม">เซ็นทรัล นครปฐม</option><option value="เซ็นทรัล บางนา">เซ็นทรัล บางนา</option><option value="เซ็นทรัล พระราม 2">เซ็นทรัล พระราม 2</option><option value="เซ็นทรัล พระราม 3">เซ็นทรัล พระราม 3</option><option value="เซ็นทรัล รามอินทรา">เซ็นทรัล รามอินทรา</option><option value="เซ็นทรัล ลาดพร้าว">เซ็นทรัล ลาดพร้าว</option><option value="เซ็นทรัล อีสวิลล์">เซ็นทรัล อีสวิลล์</option><option value="เซ็นทรัล แจ้งวัฒนะ">เซ็นทรัล แจ้งวัฒนะ</option><option value="เซ็นทรัลเวสต์วิลล์">เซ็นทรัลเวสต์วิลล์</option><option value="เซ็นทรัลเวสเกต">เซ็นทรัลเวสเกต</option><option value="เซ็นทรัลเวิล">เซ็นทรัลเวิล</option><option value="เดอะพรอมานาด">เดอะพรอมานาด</option><option value="เดอะมอลล์ ท่าพระ">เดอะมอลล์ ท่าพระ</option><option value="เดอะมอลล์ บางกะปิ">เดอะมอลล์ บางกะปิ</option><option value="เดอะมอลล์ บางแค">เดอะมอลล์ บางแค</option><option value="เดอะมอลล์งามวงศ์วาน">เดอะมอลล์งามวงศ์วาน</option><option value="เทอมินอลอโศก">เทอมินอลอโศก</option><option value="เมกา บางนา">เมกา บางนา</option><option value="เมเจอร์ รัชโยธิน">เมเจอร์ รัชโยธิน</option><option value="เลียบด่วนรามอินทรา">เลียบด่วนรามอินทรา</option><option value="เอ็มควอเทียร์">เอ็มควอเทียร์</option><option value="ไม่ประจำสาขา">ไม่ประจำสาขา</option></select><label>ตำแหน่ง</label><select id="role" required><option value="">-- เลือกตำแหน่ง --</option><option value="ผู้จัดการสาขา">ผู้จัดการสาขา</option><option value="รองผู้จัดการสาขา">รองผู้จัดการสาขา</option><option value="ผู้ช่วยผู้จัดการสาขา (ฟร้อน 3)">ผู้ช่วยผู้จัดการสาขา (ฟร้อน 3)</option><option value="ผู้ประสานงานคลินิก (เสมียน)">ผู้ประสานงานคลินิก (เสมียน)</option><option value="แคชเชียร์">แคชเชียร์</option><option value="ล่าม">ล่าม</option><option value="ฟร้อนเลเซอร์ขน">ฟร้อนเลเซอร์ขน</option><option value="พนักงานต้อนรับ (ฟร้อนท์เลเซอร์พิโค)">พนักงานต้อนรับ (ฟร้อนท์เลเซอร์พิโค)</option><option value="นักกายภาพ (SP)">นักกายภาพ (SP)</option><option value="นักกายภาพและเลเซอร์ (LSP)">นักกายภาพและเลเซอร์ (LSP)</option><option value="นักกายภาพ (LS)">นักกายภาพ (LS)</option><option value="พยาบาล">พยาบาล</option><option value="ผู้ช่วยแพทย์">ผู้ช่วยแพทย์</option><option value="ผู้ช่วยแพทย์ Pico">ผู้ช่วยแพทย์ Pico</option><option value="ผู้ช่วยโกน">ผู้ช่วยโกน</option><option value="ผู้ช่วยพยาบาล (ANA)">ผู้ช่วยพยาบาล (ANA)</option></select><button onclick="start()">เริ่มทำข้อสอบ</button></div><div id="exam" class="hide"><div class="top"><b id="count"></b><b>ไม่จำกัดเวลา</b></div><div class="track"><div id="bar" class="bar"></div></div><div id="card" class="c"></div><div class="top"><button onclick="go(-1)">ย้อนกลับ</button><button id="next" onclick="go(1)">ถัดไป</button></div></div><div id="result" class="c hide"></div></div><script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbwimtr_tjOO7qQX5io1EooM2vmVlLRjnjDO0TT70XvaDBpzqNclPwDMLDTxbUti9zmF/exec';
const Q=[
['ลูกค้าบอก “หน้าดูโทรม แต่งหน้าไม่ค่อยสวย อยากทำอะไรให้ผิวดูดีขึ้น” พนักงานควรเริ่มอย่างไร',['ถามเพิ่มว่ากังวลเรื่องใดชัดที่สุด เช่น แห้ง ริ้วเล็ก หรือผิวไม่เรียบ','ถามงบประมาณและความสะดวก แล้วเลือก PN ที่ได้รับความนิยมในช่วงนี้','เทียบปริมาณและรายละเอียดของ PN แต่ละตัว แล้วเลือกตัวที่มีปริมาณสูง','ถามเวลาที่สะดวกและจำนวนครั้งที่มาได้ แล้วเลือกโปรแกรมที่ใช้ครั้งน้อย'],'ต้องค้นหา Need ก่อนเลือกผลิตภัณฑ์','ถามสั้น ๆ ว่าแห้ง ริ้วเล็ก หรือผิวไม่เรียบ'],
['ลูกค้าผิวแห้งและมีริ้วเล็ก แต่เพื่อนบอกให้ทำตัวเดียวกับเขา ควรตอบอย่างไร',['เช็กว่าคนใกล้ตัวใช้ผลิตภัณฑ์ใด แล้วเลือกตามตัวที่ได้ผลดี','ทวนปัญหาผิวแห้งและริ้วเล็ก แล้วใช้ความต้องการของลูกค้าเป็นหลัก','เทียบปริมาณ PN และรายละเอียดของแต่ละผลิตภัณฑ์ก่อนตัดสินใจเลือก','เลือกจากจำนวนครั้งและช่วงเวลาที่ลูกค้าสะดวกเข้ารับบริการเป็นหลัก'],'ใช้ Need ของลูกค้าคนนี้ ไม่เลือกตามเพื่อน','ทวนปัญหาที่ลูกค้าบอกแล้วเชื่อมไปสู่ตัวเลือก'],
['ลูกค้ามาเพราะรีวิว PN แต่จริง ๆ กังวลที่สุดว่าแก้มตอบ ควรทำอย่างไร',['เลือก PN ที่เน้นความชุ่มชื้น เพื่อช่วยให้บริเวณแก้มดูสดใสขึ้น','เพิ่มปริมาณ PN เพื่อดูแลคุณภาพผิวและบริเวณแก้มตอบในครั้งเดียว','อธิบายว่าแก้มตอบกับคุณภาพผิวเป็นคนละเป้าหมาย แล้วแยกการดูแล','อธิบาย PN และ Filler แบบสั้น ๆ แล้วให้ลูกค้าเลือกเองก่อนพบแพทย์'],'แก้มตอบกับคุณภาพผิวเป็นคนละเป้าหมาย','แยก “ผิวดีขึ้น” ออกจาก “เติมส่วนที่ตอบ”'],
['ลูกค้าสนใจ PN แต่ทำงานพบลูกค้าทุกวันและไม่อยากบวมแดงนาน ควรถามอะไรต่อ',['ถามงบประมาณและจำนวนครั้งที่ลูกค้าสะดวกเข้ารับบริการ','ถามว่าผลิตภัณฑ์ที่เคยสนใจเป็นรุ่นหรือยี่ห้อใดมาก่อน','ถามว่าลูกค้าตั้งใจทำกี่ครั้งและสะดวกมาช่วงเวลาใด','ถามวันสำคัญและช่วงที่พักหน้าได้ เพื่อวางแผนช่วงพักผิว'],'ข้อจำกัด downtime มีผลต่อแผน','ถามตารางงานและวันสำคัญก่อน'],
['ลูกค้าถาม “เพิ่มปริมาณเยอะ ๆ ครั้งเดียวแทนโปรแกรมได้ไหม”',['ปริมาณต่อครั้งกับจำนวนครั้งต่างกัน จึงไม่ควรเพิ่มปริมาณเพื่อใช้แทนโปรแกรม','เพิ่มปริมาณได้หากลูกค้ายอมรับอาการบวมและช่วงพักผิวที่อาจเพิ่มขึ้น','เพิ่มได้หากเลือกผลิตภัณฑ์ที่ไม่มี Lidocaine เป็นส่วนประกอบในสูตร','เลือกผลิตภัณฑ์ที่มีปริมาณ PN สูงกว่าเพื่อใช้แทนจำนวนครั้งของโปรแกรม'],'ไม่ควรใช้ปริมาณแทนจำนวนครั้งโดยพลการ','อธิบายว่าปริมาณต่อครั้งกับจำนวนครั้งไม่ใช่สิ่งเดียวกัน'],
['ลูกค้าผิวแห้งและกังวลเรื่องความรู้สึกขณะทำ เหตุผลใดเชื่อมกับ HB PLUS ได้เหมาะสม',['มีความเข้มข้นของ PN สูง จึงเหมาะกับผิวแห้งและคนที่กลัวเจ็บ','มี HA ช่วยเรื่องความชุ่มชื้น และ Lidocaine ช่วยลดความรู้สึกขณะทำ','ทำเพียงครั้งเดียวและผลโดยรวมสามารถอยู่ได้นานประมาณ 6–12 เดือน','มีเฉพาะ PN เป็นหลัก จึงลดโอกาสรู้สึกระคายระหว่างทำได้มากกว่า'],'HB PLUS มี HA และ Lidocaine','พูดว่า “ช่วยลดความรู้สึก” ไม่ใช่ “ไม่เจ็บแน่นอน”'],
['ลูกค้าถาม “PLINEST เหมาะกับหนูเพราะอะไร?” ทั้งที่ยังไม่เล่าปัญหา',['อธิบายแหล่งผลิตและมาตรฐานของผลิตภัณฑ์เพื่อใช้ประกอบการเลือก','อธิบายปริมาณ 2 mL และจำนวนครั้ง เพื่อใช้ประกอบการตัดสินใจ','ถามปัญหาและผลที่ต้องการก่อน แล้วเชื่อมจุดเด่นที่ตรงกับลูกค้า','อธิบายว่าเป็น PN สำหรับดูแลคุณภาพผิวและเหมาะกับลูกค้าหลายกลุ่ม'],'ยังไม่มีข้อมูลพอจะบอกว่าเหมาะเพราะอะไร','เริ่มจากปัญหา แล้วค่อยเชื่อมจุดเด่น'],
['ลูกค้าบอก “งบไม่ใช่ปัญหา เอาตัว PN เยอะที่สุด”',['เลือกผลิตภัณฑ์ราคาสูงที่สุด เพราะลูกค้าไม่ได้มีข้อจำกัดด้านงบประมาณ','เลือกโปรแกรมที่ใช้จำนวนครั้งน้อยที่สุด เพื่อให้ลูกค้าเข้ารับบริการได้สะดวก','เลือกประเทศผู้ผลิตที่ลูกค้าเชื่อมั่น แล้วจึงเปรียบเทียบรายละเอียด','ดูปัญหา ผลที่ต้องการ ความกังวล และแผนร่วมกัน โดยไม่ใช้ปริมาณ PN เป็นหลัก'],'ความเข้มข้นอย่างเดียวไม่บอกความเหมาะสม','ใช้ Need + concern + plan'],
['เคยทำ PN แล้วชอบแต่จำชื่อไม่ได้ วันนี้ควรทำตัวเดิมไหม',['เช็กผลิตภัณฑ์ ปริมาณ ผลและอาการหลังทำ แล้วเทียบกับเป้าหมายวันนี้','เลือกทำตัวเดิมได้ เพราะครั้งก่อนลูกค้าพอใจกับผลและไม่มีปัญหา','เปลี่ยนผลิตภัณฑ์จากครั้งก่อน เพื่อหลีกเลี่ยงการใช้ตัวเดิมต่อเนื่อง','เลือกผลิตภัณฑ์ที่มีส่วนประกอบมากกว่า เพื่อดูแลหลายปัญหาในครั้งเดียว'],'ประวัติเดิมต้องเทียบกับ Need ปัจจุบัน','ถามชื่อ ปริมาณ ผล อาการ และเป้าหมายวันนี้'],
['ลูกค้าอยากผิวดีขึ้นแต่ร่องก็ดูลึกขึ้น ควรอธิบายอย่างไร',['เพิ่มจำนวนครั้งของ PN เพื่อดูแลทั้งคุณภาพผิวและร่องที่ดูลึกขึ้น','เลือก Filler เพราะสามารถแก้ปัญหาผิวและร่องลึกได้ครอบคลุมกว่า','แยกเป้าหมายคุณภาพผิวกับการเติม Volume แล้วให้แพทย์วางแผน','เลือกเพียงเป้าหมายเดียวก่อน เพื่อไม่ให้แผนการดูแลซับซ้อนเกินไป'],'คุณภาพผิวกับ Volume เป็นคนละเป้าหมาย','ช่วยลูกค้าแยกปัญหาก่อน'],
['ลูกค้าถาม “ทำแล้วหน้าจะเหมือนรูปรีวิวไหม?”',['รีวิวเป็นเพียงตัวอย่าง เพราะพื้นฐานผิวและการตอบสนองแต่ละคนต่างกัน','หากใช้ผลิตภัณฑ์เดียวกับรีวิว ผลลัพธ์โดยรวมก็ควรใกล้เคียงกัน','หากทำจำนวนครั้งเท่ากับในรีวิว ผลลัพธ์โดยรวมก็ควรใกล้เคียงกัน','ใช้รูปรีวิวเป็นเป้าหมายหลัก แล้ววางแผนการทำให้ได้ผลใกล้เคียงกัน'],'รีวิวไม่ใช่การรับประกันผล','ใช้รีวิวเป็นตัวอย่าง แล้วกลับมาที่ลูกค้า'],
['ลูกค้าบอก “แฟนบอกว่าผิวยังไม่แย่ ไม่ต้องทำ”',['อธิบายจุดที่ผิวเริ่มเปลี่ยน เพื่อให้ลูกค้าเห็นสิ่งที่ยังไม่ทันสังเกต','ถามว่าลูกค้าเองอยากปรับอะไรหรือคาดหวังอะไร โดยไม่ชี้นำปัญหาเพิ่ม','อธิบายว่าการเริ่มดูแลเร็วอาจเหมาะกว่าการรอให้ปัญหาชัดเจนขึ้น','เสนอโปรแกรมตามช่วงอายุ เพื่อให้ลูกค้ามีข้อมูลประกอบการตัดสินใจ'],'ไม่ควรสร้างปัญหาเพื่อปิดการขาย','ถามความต้องการของลูกค้าเอง'],
['ลูกค้าถาม “ทำไมต้องทำเป็นโปรแกรม ทำครั้งเดียวไม่ได้เหรอ?”',['เพิ่มปริมาณต่อครั้ง เพื่อใช้แทนจำนวนครั้งและลดระยะของโปรแกรมให้สั้นลง','จำนวนครั้งกำหนดจากงบประมาณและความสะดวกในการเข้ารับบริการของลูกค้าเป็นหลัก','แต่ละผลิตภัณฑ์มีโปรแกรมต่างกัน จึงไม่ควรปรับจำนวนครั้งเอง ให้แพทย์ประเมิน','PN แต่ละตัวมีโปรแกรมใกล้เคียงกัน จึงกำหนดจำนวนครั้งเท่ากันได้ตามแนวทาง'],'อธิบายตามโปรแกรม ไม่ดัดแปลงเพื่อขาย','ไม่รับประกันผลจากการเปลี่ยนจำนวนครั้งเอง'],
['ลูกค้ากลัวทำ PN แล้วหน้าดูเต็มหรือเปลี่ยนรูปหน้า',['ถ้าใช้ปริมาณไม่มาก PN จะไม่ทำให้ใบหน้าดูเต็มหรือเปลี่ยนรูปหน้าได้','PN และ Filler ให้ผลใกล้เคียงกัน โดยต่างกันหลัก ๆ ที่ปริมาณผลิตภัณฑ์','เลือก PN ที่ไม่มี HA เพื่อหลีกเลี่ยงผลที่อาจทำให้ใบหน้าดูเต็มขึ้น','PN เน้นคุณภาพผิว ส่วน Filler เน้น Volume/โครงสร้าง จึงแยกเป้าหมายให้ชัด'],'ต้องแยกบทบาท PN กับ Filler','PN = คุณภาพผิว; Filler = Volume/โครงสร้าง'],
['ลูกค้าบอก “สามตัวนี้คล้ายกัน เลือกไม่ถูก”',['กลับมาดูปัญหาหลัก ความกังวล และผลที่ต้องการ แล้วตัดตัวเลือกที่ไม่ตรง','เรียงผลิตภัณฑ์ตามระดับราคา แล้วเลือกตัวที่เหมาะกับงบประมาณของลูกค้า','เรียงผลิตภัณฑ์ตามปริมาณ PN แล้วเลือกตัวที่มีปริมาณตรงกับความต้องการ','เลือกจากประเทศผู้ผลิตที่ลูกค้าเชื่อมั่น แล้วค่อยพิจารณารายละเอียดอื่น'],'Need/concern/result ช่วยตัดตัวเลือกได้จริง','ใช้กรอบ ปัญหา–กังวล–ผลลัพธ์'],
['ลูกค้าบอก “งบได้หมด จัดแพ็กเกจคุ้มที่สุด”',['เริ่มจากแพ็กเกจขนาดใหญ่ที่สุด เพราะลูกค้าไม่ได้จำกัดงบประมาณ','ประเมินผลิตภัณฑ์และจำนวนที่เหมาะก่อน แล้วค่อยเลือกแพ็กเกจที่ตรงแผน','นำเสนอทุกแพ็กเกจพร้อมกัน เพื่อให้ลูกค้าเปรียบเทียบและเลือกด้วยตัวเอง','เลือกแพ็กเกจที่มีสิทธิประโยชน์หรือของแถมรวมมากที่สุดเป็นหลัก'],'ความคุ้มต้องอยู่บนแผนที่เหมาะ','วางแผนก่อน แล้วค่อยใช้โปร'],
['ลูกค้าบอก “ราคาต่างกันไม่มาก เอาตัวแพงสุด น่าจะดีที่สุด”',['ราคาที่สูงกว่ามักสะท้อนคุณภาพที่สูงกว่า จึงเลือกตัวแพงที่สุดได้','เมื่องบประมาณเพียงพอ ควรเลือกตัวราคาสูงเพื่อให้ได้ผลลัพธ์ที่ดีที่สุด','ราคาเป็นข้อมูลหนึ่ง แต่ความเหมาะสมต้องดูจากปัญหาและความกังวลของลูกค้า','เลือกผลิตภัณฑ์ราคาระดับกลาง เพื่อลดความเสี่ยงจากการเลือกสูงหรือต่ำเกินไป'],'ราคาไม่ใช่ตัวแทนความเหมาะสม','ขาย “ตรงปัญหา” ไม่ใช่ “แพงกว่า”'],
['ลูกค้าจะซื้อแพ็กใหญ่เพราะกลัวโปรหมด ทั้งที่ไม่รู้ว่าจะใช้ครบไหม',['ซื้อแพ็กเกจไว้ก่อนเพื่อรักษาสิทธิ์ แล้วค่อยวางแผนการใช้เมื่อพร้อม','ลดจำนวนลงครึ่งหนึ่ง เพื่อให้ได้สิทธิ์โปรแต่ไม่ซื้อเกินความจำเป็น','จองสิทธิ์ตามจำนวนสูงสุดที่โปรกำหนด เพื่อไม่ให้เสียโอกาสครั้งนี้','เช็กผลิตภัณฑ์และจำนวนให้ตรงแผนก่อน ไม่ซื้อเพิ่มเพียงเพราะกลัวโปรหมด'],'โปรไม่ควรทำให้ซื้อเกินแผน','ใช้โปรหลังรู้แผน'],
['ลูกค้าบอก “วันนี้ยังไม่ซื้อ ครั้งหน้าค่อยใช้โปร”',['อธิบายเงื่อนไขและช่วงเวลาของโปรปัจจุบันให้ครบ โดยไม่เร่งให้ซื้อเกินจำเป็น','แจ้งว่าครั้งหน้าอาจไม่ได้ราคาเดิม จึงควรตัดสินใจภายในวันนี้เพื่อความคุ้มค่า','แนะนำให้ซื้อสิทธิ์สูงสุดไว้ก่อน แล้วค่อยเลือกใช้ตามความเหมาะสมภายหลัง','ยังไม่ต้องอธิบายเงื่อนไขโปร เพราะลูกค้ายังไม่ได้ตัดสินใจซื้อในวันนี้'],'ให้ข้อมูลโปรที่ถูกต้องโดยไม่กดดัน','บอกวัน/สิทธิ์/เงื่อนไขตามโปรปัจจุบัน'],
['ลูกค้าสนใจ A แต่ B ตรง Need มากกว่า',['เปลี่ยนเป็น B ทันที เพราะพนักงานประเมินแล้วว่าตรงกับความต้องการมากกว่า','อธิบายเฉพาะข้อดีของ B เพื่อให้ลูกค้าเห็นว่าตรงกับปัญหามากกว่า A','ทำ A ตามที่ลูกค้าสนใจ เพื่อรักษาความต้องการเดิมของลูกค้าเป็นหลัก','อธิบายความต่างที่เกี่ยวกับ Need ของ A และ B แล้วให้แพทย์ประเมินยืนยัน'],'ช่วยให้เห็นเหตุผล ไม่บังคับเปลี่ยน','เปรียบเทียบเฉพาะสิ่งที่เกี่ยวกับ Need'],
['ลูกค้ามีนัด PN วันนี้ แต่เมื่อคืนไม่สบาย เช้านี้ดีขึ้นแล้ว',['ถามอาการ เวลาเริ่ม อาการร่วม และสถานะปัจจุบัน แล้วให้แพทย์ประเมินก่อนทำ','ถ้าเช้านี้ไม่มีไข้และรู้สึกดีขึ้น สามารถทำตามนัดเดิมได้โดยไม่ต้องเลื่อน','เลื่อนการทำออกไปก่อนทุกกรณี เพราะเมื่อคืนเพิ่งมีอาการไม่สบายเกิดขึ้น','เปลี่ยนเป็นผลิตภัณฑ์ที่ไม่มี Lidocaine เพื่อลดปัจจัยที่อาจเกี่ยวกับอาการ'],'คำว่า “ดีขึ้น” ยังไม่พอสำหรับประเมิน','เก็บอาการ–เวลา–สถานะปัจจุบัน'],
['ลูกค้าเคยทำ PN ไม่มีปัญหา แต่เพิ่งเริ่มยาใหม่',['ทำได้ตามแผนเดิม เพราะครั้งก่อนทำ PN แล้วไม่พบอาการผิดปกติหลังรับบริการ','ถามชื่อยา เหตุผลที่ใช้ วันที่เริ่ม และข้อมูลที่เกี่ยวข้อง แล้วให้แพทย์ประเมิน','แนะนำให้หยุดยาใหม่ประมาณ 7 วัน แล้วกลับมาทำ PN ตามแผนเดิมเมื่อครบกำหนด','เปลี่ยนเป็น PN คนละผลิตภัณฑ์จากครั้งก่อน เพื่อหลีกเลี่ยงปัจจัยร่วมที่มาจากยาใหม่'],'ประวัติเดิมไม่แทนข้อมูลยาปัจจุบัน','อย่าแนะนำหยุดยาเอง'],
['ครั้งก่อนทำ PN แล้วบวมแดงหลายวันก่อนหาย วันนี้อยากทำซ้ำ',['อธิบายว่าเป็นอาการหลังทำที่อาจพบได้ จึงสามารถทำซ้ำตามโปรแกรมเดิมได้ตามปกติ','งดทำ PN ซ้ำในครั้งนี้ เพราะเคยมีอาการบวมแดงหลายวันหลังทำครั้งก่อน','ถามเวลาเริ่ม ระยะเวลา ความรุนแรงและอาการร่วม แล้วให้แพทย์ประเมินก่อน','เปลี่ยนเป็นผลิตภัณฑ์ที่มี Lidocaine เพื่อลดโอกาสเกิดอาการหลังทำแบบเดิม'],'ต้องเก็บรายละเอียดอาการเดิม','ถาม onset–duration–severity–อาการร่วม'],
['ลูกค้าถาม “ถ้าเป็นพี่ พี่จะเลือกตัวไหน?”',['ไม่เลือกผลิตภัณฑ์ใด และให้ลูกค้ารอคำแนะนำจากแพทย์เพียงอย่างเดียว','เลือกผลิตภัณฑ์ที่ได้รับความนิยมและขายดี เพื่อให้ลูกค้าตัดสินใจง่ายขึ้น','เลือกผลิตภัณฑ์ราคาระดับกลาง เพราะเป็นทางเลือกที่ราคาไม่สูงหรือต่ำเกินไป','แนะนำจากปัญหาพร้อมเหตุผล แล้วให้แพทย์ประเมินเพื่อยืนยันแผนสุดท้าย'],'พนักงานแนะนำจาก Need ได้โดยไม่ข้ามบทบาทแพทย์','แนะนำอย่างมีเหตุผล แล้วให้แพทย์ยืนยัน'],
['มีงานแต่งเดือนหน้า ผิวแห้ง กลัวเจ็บ ทำงานพบลูกค้าทุกวัน ไม่อยากบวมนาน',['ปัญหาผิว → ความกังวลเจ็บ/บวม → เวลาถึงงาน → ตัวเลือก → แพทย์ยืนยัน','งบประมาณ → โปรโมชั่น → เลือก PN → นัดวันที่สะดวกก่อนถึงวันงาน','ประเทศผู้ผลิต → ระดับราคา → ดูรีวิว → เลือกโปรแกรมที่ลูกค้าสนใจ','มี Lidocaine หรือไม่ → เลือกแพ็กเกจ → กำหนดวันทำก่อนถึงงานสำคัญ'],'ต้องรวม Need, pain, downtime และ deadline','ปัญหา → ข้อจำกัด → เวลา → ตัวเลือก → แพทย์'],
['อยากผิวดีขึ้น มีสิวอักเสบ เพิ่งเลเซอร์ไม่กี่วัน และเดินทางสัปดาห์หน้า',['เลือกผลิตภัณฑ์ที่พักหน้าน้อย แล้ววางแผนทำก่อนเดินทางตามความสะดวก','เก็บสภาพผิว วันที่และชนิดเลเซอร์ รวมถึงแผนเดินทาง แล้วให้แพทย์ประเมิน','งด PN อย่างน้อยหนึ่งเดือนหลังเลเซอร์ทุกกรณี แล้วค่อยกลับมาประเมินใหม่','ทำเฉพาะบริเวณที่ไม่มีสิวอักเสบ เพื่อหลีกเลี่ยงบริเวณที่ผิวยังมีปัญหา'],'มีหลายปัจจัยด้านความพร้อม','ถามผิวปัจจุบัน + หัตถการล่าสุด + เดินทาง'],
['ลูกค้าไม่แน่ใจว่า PN เหมาะไหม หรือทำอย่างอื่นก็ได้ วันนี้ไม่จำเป็นต้องทำ',['อธิบาย PN ทุกยี่ห้อที่มี เพื่อให้ลูกค้าเห็นตัวเลือกทั้งหมดก่อนตัดสินใจ','เสนอโปรโมชั่นที่คุ้มที่สุดก่อน เพราะลูกค้ายังไม่ได้กำหนดว่าจะทำอะไร','ถามปัญหาหลักและผลที่อยากได้ แล้วอธิบายเฉพาะทางเลือกที่เกี่ยวข้อง','ให้ลูกค้ากลับไปศึกษาข้อมูลเพิ่มเติม แล้วค่อยนัดมาปรึกษาใหม่เมื่อพร้อม'],'เริ่มจากเป้าหมาย ไม่ใช่สินค้า','ถาม “อยากแก้อะไรที่สุด”'],
['ก่อนพบแพทย์พนักงานคิดว่า A ตรง Need แต่แพทย์เลือก B ลูกค้าถาม “ใครพูดถูก?”',['ยืนยันว่า A ยังเป็นตัวเลือกที่เหมาะ เพราะเป็นคำแนะนำจากข้อมูลที่คุยกับลูกค้าก่อน','อธิบายว่าแพทย์เลือก B เพราะมีรายละเอียดหรือโปรโมชั่นที่เหมาะกับแผนมากกว่า','อธิบายว่าพนักงานให้ข้อมูลเบื้องต้นไม่ได้ จึงต้องยึดคำแนะนำของแพทย์เท่านั้น','อธิบายว่าคำแนะนำแรกมาจากข้อมูลที่คุย ส่วนแพทย์มีข้อมูลจากการประเมินเพิ่ม จึงเลือก B'],'รักษาความต่อเนื่องของทีม','อธิบายบทบาทก่อนและหลังแพทย์ประเมิน']
];
const W=['เพื่อนทำ PN แล้วผิวดีมาก แต่หนูไม่รู้ว่าตัวเองมีปัญหาอะไร แค่รู้สึกหน้าดูโทรม ช่วงนี้ทำงานหนัก นอนน้อย และไม่อยากบวมเพราะต้องเจอลูกค้าทุกวัน ถ้าเป็นพี่จะเลือกอะไรให้หนู?','อยากให้ผิวดีขึ้น แก้มก็ดูตอบนิดหน่อย กลัวเจ็บ และอีกประมาณ 2 สัปดาห์มีงานสำคัญ งบไม่มีปัญหา เอาตัวที่ดีที่สุดให้เลย'];
let i=0,a=Array(30).fill('');
const L=['A','B','C','D'];
let qOrder=[],optOrder={};
function e(x){return document.getElementById(x)}
function prof(){return{firstName:e('firstName').value,lastName:e('lastName').value,nickname:e('nickname').value,branch:e('branch').value,role:e('role').value}}
function shuffle(arr){for(let x=arr.length-1;x>0;x--){const j=Math.floor(Math.random()*(x+1));[arr[x],arr[j]]=[arr[j],arr[x]]}return arr}
function makeOrder(){qOrder=shuffle([...Array(28).keys()]);optOrder={};qOrder.forEach(q=>optOrder[q]=shuffle([0,1,2,3]));qOrder.push(28,29)}
function save(){localStorage.setItem('PNRTB',JSON.stringify({i,a,p:prof(),qOrder,optOrder}))}
function start(){if(Object.values(prof()).some(x=>!x.trim()))return alert('กรอกข้อมูลให้ครบ');if(!qOrder.length)makeOrder();e('start').classList.add('hide');e('exam').classList.remove('hide');render();save()}
function render(){
 e('count').textContent=`ข้อ ${i+1}/30`;e('bar').style.width=((i+1)/30*100)+'%';let h='';
 const qid=qOrder[i];
 if(qid<28){
   h=`<h2>${i+1}. ${Q[qid][0]}</h2>`;
   (optOrder[qid]||[0,1,2,3]).forEach((origIdx,displayIdx)=>{
     const originalLetter=L[origIdx];
     h+=`<label class=o><input type=radio name=a value=${originalLetter} ${a[qid]===originalLetter?'checked':''} onchange="a[${qid}]=this.value;save()"><b>${L[displayIdx]}.</b> ${Q[qid][1][origIdx]}</label>`
   })
 }else{
   const wid=qid-28;
   h=`<h2>${i+1}. ${W[wid]}</h2><textarea oninput="a[${qid}]=this.value;save()" placeholder="ตอบเป็นประโยคที่ใช้คุยกับลูกค้าได้จริง">${a[qid]}</textarea>`
 }
 e('card').innerHTML=h;e('next').textContent=i===29?'ส่งข้อสอบ':'ถัดไป'
}
function go(d){const qid=qOrder[i];if(d>0&&!String(a[qid]).trim())return alert('กรุณาตอบข้อนี้ก่อน');if(i===29&&d>0)return submit();i=Math.max(0,Math.min(29,i+d));render();save()}
async function submit(){
 if(a.some(x=>!String(x).trim()))return alert('ยังตอบไม่ครบ');
 if(!confirm('ยืนยันส่งข้อสอบ? ส่งแล้วแก้ไม่ได้'))return;
 e('next').disabled=true;
 const submissionId='RT-'+Date.now()+'-'+Math.random().toString(36).slice(2);
 const p={action:'submitPNRetest',...prof(),answers:a,submissionId};
 e('exam').classList.add('hide');e('result').classList.remove('hide');
 e('result').innerHTML='<h1>กำลังส่งข้อสอบ</h1><div class="saving"><b>⏳ กำลังตรวจและบันทึกผล</b><br>กรุณาอย่าปิดหรือรีเฟรชหน้านี้ จนกว่าจะขึ้นข้อความว่า “บันทึกผลสอบสำเร็จแล้ว”</div>';
 window.scrollTo({top:0,behavior:'smooth'});
 try{
   const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p),redirect:'follow'});
   if(!r.ok)throw Error('Server ตอบกลับ '+r.status);
   const o=await r.json();
   if(!o.success)throw Error(o.message||'ระบบยังไม่ยืนยันการบันทึก');
   localStorage.removeItem('PNRTB');
   show(o,true)
 }catch(err){
   e('result').innerHTML=`<h1>ยังบันทึกผลไม่สำเร็จ</h1><div class="savefail"><b>❌ ยังบันทึกผลสอบไม่สำเร็จ</b><br>${String(err.message||err)}<br><br>คำตอบของคุณยังถูกเก็บไว้ กรุณากดปุ่มด้านล่างเพื่อลองส่งอีกครั้ง</div><button onclick="e('result').classList.add('hide');e('exam').classList.remove('hide');e('next').disabled=false;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">กลับไปส่งอีกครั้ง</button>`;
 }
}
function show(o,saveConfirmed){
 const TH={
  'Need Discovery':'การค้นหาความต้องการลูกค้า',
  'Product Matching':'การเลือกผลิตภัณฑ์ให้เหมาะกับลูกค้า',
  'Communication':'การสื่อสารกับลูกค้า',
  'Sales & Promotion':'การขายและโปรโมชั่น',
  'Safety & Scope':'ความปลอดภัยและขอบเขตการให้ข้อมูล',
  'Integrated Case':'การประยุกต์ใช้กับเคสจริง'
 };
 const th=x=>TH[String(x).trim()]||String(x);
 e('exam').classList.add('hide');e('result').classList.remove('hide');
 const passed=o.result==='ผ่าน';
 let h=`<h1>ผลสอบ PN RETEST B</h1>${saveConfirmed?'<div class="saved"><b>✅ บันทึกผลสอบสำเร็จแล้ว</b><br>ระบบได้รับการยืนยันจากเซิร์ฟเวอร์และบันทึกผลเรียบร้อยแล้ว</div>':''}<div class="resultBox ${passed?'resultPass':'resultFail'}"><div style="font-size:22px;font-weight:800">${passed?'✓ ผ่าน':'✕ ไม่ผ่าน'}</div><div class="scoreBig">${o.totalScore}/38</div><div style="font-size:22px;font-weight:700">${o.percent}%</div><div class="muted">เกณฑ์ผ่าน 80%</div></div>`;
 const lows=[];
 if(o.categoryPct){h+='<h3>คะแนนแยกหมวด</h3>';for(const[k,v0]of Object.entries(o.categoryPct)){const v=Number(v0);if(v<80)lows.push(k);h+=`<div class="cat ${v<80?'catLow':''}"><b>${th(k)}</b>: ${v0}% ${v<80?'• ควรทบทวน':''}</div>`}}
 let review=[];
 if(Array.isArray(o.reviewTopics)) review=o.reviewTopics.filter(Boolean);
 else if(typeof o.reviewTopics==='string'&&o.reviewTopics.trim()) review=o.reviewTopics.split(/[,|\n]+/).map(x=>x.trim()).filter(Boolean);
 if(!review.length) review=lows;
 h+='<div class=reviewBox><h3>แนะนำให้ทบทวน</h3>';
 if(review.length) h+=`<div>${[...new Set(review)].map(x=>'• '+th(x)).join('<br>')}</div>`;
 else h+='<div class=ok>ผ่านเกณฑ์และไม่พบหมวดที่ต้องทบทวนเป็นพิเศษ</div>';
 h+='</div>';
 if(o.wrongQuestions?.length){h+='<h3>ข้อที่ตอบผิดและควรทบทวน</h3>';o.wrongQuestions.forEach(w=>{let x=Q[w.question-1];const shown=qOrder.indexOf(w.question-1)+1;const si=L.indexOf(String(w.selected||'').toUpperCase());const ci=L.indexOf(String(w.correct||'').toUpperCase());const st=x&&si>=0?x[1][si]:w.selected;const ct=x&&ci>=0?x[1][ci]:w.correct;h+=`<div class=wrong><b>ข้อ ${shown>0?shown:w.question}</b><br><b>คำตอบที่เลือก:</b> ${st}<br><b>คำตอบที่ถูก:</b> ${ct}<br><b>เหตุผล:</b> ${x?x[2]:''}<br><b>นำไปใช้จริง:</b> ${x?x[3]:''}</div>`})}else h+='<p class=ok>✓ ข้อปรนัยถูกทั้งหมด</p>';
 h+='<p class=muted>คำตอบข้อ 29–30 ถูกบันทึกและประเมินตาม Rubric แล้ว</p>';
 e('result').innerHTML=h;window.scrollTo({top:0,behavior:'smooth'})
}try{let s=JSON.parse(localStorage.getItem('PNRTB'));if(s){Object.entries(s.p||{}).forEach(([k,v])=>{if(e(k))e(k).value=v});i=s.i||0;a=s.a||a;qOrder=Array.isArray(s.qOrder)&&s.qOrder.length===30?s.qOrder:[];optOrder=s.optOrder||{};if(a.some(x=>x)){if(!qOrder.length)makeOrder();e('start').classList.add('hide');e('exam').classList.remove('hide');render();save()}}}catch(_){}
</script></body></html>
